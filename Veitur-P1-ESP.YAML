switch:
  - platform: gpio
    name: "P1 Request Trigger"
    pin: D5
    id: p1_request

  - platform: restart
    name: "Restart device"

interval:
  - interval: 30s
    then:
      - switch.turn_on: p1_request
      - delay: 50ms
      - switch.turn_off: p1_request

uart:
  id: uart_bus
  rx_pin: D7
  rx_buffer_size: 3072
  baud_rate: 9600
  data_bits: 7
  parity: NONE
  stop_bits: 1
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 500ms
    sequence:
      - lambda: |-
          std::string chunk(bytes.begin(), bytes.end());
          id(p1_buffer) += chunk;

          auto extract_numeric = [](const std::string &telegram, const std::string &key, float &out) -> bool {
            size_t p = telegram.find(key);
            if (p == std::string::npos) return false;
            p += key.size();
            size_t end = telegram.find_first_of("*)", p);
            if (end == std::string::npos || end <= p) return false;
            std::string s = telegram.substr(p, end - p);
            out = atof(s.c_str());
            return true;
          };

          auto &buf = id(p1_buffer);

          size_t slash = buf.find('/');
          if (slash != std::string::npos && slash > 0) {
            buf.erase(0, slash);
          }

          while (true) {
            size_t end = std::string::npos;
            size_t marker_len = 0;

            size_t p1 = buf.find("!\r\n");
            size_t p2 = buf.find("!\n");
            size_t p3 = buf.find("!");

            if (p1 != std::string::npos) {
              end = p1;
              marker_len = 3;
            } else if (p2 != std::string::npos) {
              end = p2;
              marker_len = 2;
            } else if (p3 != std::string::npos) {
              end = p3;
              marker_len = 1;
            } else {
              break;
            }

            std::string telegram = buf.substr(0, end + marker_len);
            buf.erase(0, end + marker_len);

            if (telegram.find('/') == std::string::npos) {
              continue;
            }

            float v = NAN;

            // Totals
            if (extract_numeric(telegram, "1-0:1.8.0(", v)) {
              float old_v = id(g_cumulative_active_import);
              float diff = v - old_v;
              if (isnan(old_v) || (diff >= -0.0005f && diff <= 0.15f)) {
                id(g_cumulative_active_import) = v;
              } else {
                ESP_LOGW("p1", "Discarded cumulative import jump: old=%.6f new=%.6f diff=%.6f",
                         old_v, v, diff);
              }
            }

            if (extract_numeric(telegram, "1-0:2.8.0(", v)) id(g_cumulative_active_export) = v;
            if (extract_numeric(telegram, "1-0:3.8.0(", v)) id(g_cumulative_reactive_import) = v;
            if (extract_numeric(telegram, "1-0:4.8.0(", v)) id(g_cumulative_reactive_export) = v;

            // Total momentary
            if (extract_numeric(telegram, "1-0:1.7.0(", v)) id(g_momentary_active_import) = v;
            if (extract_numeric(telegram, "1-0:2.7.0(", v)) id(g_momentary_active_export) = v;
            if (extract_numeric(telegram, "1-0:3.7.0(", v)) id(g_momentary_reactive_import) = v;
            if (extract_numeric(telegram, "1-0:4.7.0(", v)) id(g_momentary_reactive_export) = v;

            // Phase 1
            if (extract_numeric(telegram, "1-0:21.7.0(", v)) id(g_momentary_active_import_l1) = v;
            if (extract_numeric(telegram, "1-0:22.7.0(", v)) id(g_momentary_active_export_l1) = v;
            if (extract_numeric(telegram, "1-0:23.7.0(", v)) id(g_momentary_reactive_import_l1) = v;
            if (extract_numeric(telegram, "1-0:24.7.0(", v)) id(g_momentary_reactive_export_l1) = v;
            if (extract_numeric(telegram, "1-0:31.7.0(", v)) id(g_current_l1) = v;
            if (extract_numeric(telegram, "1-0:32.7.0(", v)) id(g_voltage_l1) = v;

            // Phase 2
            if (extract_numeric(telegram, "1-0:41.7.0(", v)) id(g_momentary_active_import_l2) = v;
            if (extract_numeric(telegram, "1-0:42.7.0(", v)) id(g_momentary_active_export_l2) = v;
            if (extract_numeric(telegram, "1-0:43.7.0(", v)) id(g_momentary_reactive_import_l2) = v;
            if (extract_numeric(telegram, "1-0:44.7.0(", v)) id(g_momentary_reactive_export_l2) = v;
            if (extract_numeric(telegram, "1-0:51.7.0(", v)) id(g_current_l2) = v;
            if (extract_numeric(telegram, "1-0:52.7.0(", v)) id(g_voltage_l2) = v;

            // Phase 3
            if (extract_numeric(telegram, "1-0:61.7.0(", v)) id(g_momentary_active_import_l3) = v;
            if (extract_numeric(telegram, "1-0:62.7.0(", v)) id(g_momentary_active_export_l3) = v;
            if (extract_numeric(telegram, "1-0:63.7.0(", v)) id(g_momentary_reactive_import_l3) = v;
            if (extract_numeric(telegram, "1-0:64.7.0(", v)) id(g_momentary_reactive_export_l3) = v;
            if (extract_numeric(telegram, "1-0:71.7.0(", v)) id(g_current_l3) = v;
            if (extract_numeric(telegram, "1-0:72.7.0(", v)) id(g_voltage_l3) = v;

            // Water / heat
            if (extract_numeric(telegram, "0-1:24.2.1(", v)) {
              float old_v = id(g_hot_water_volume);
              float diff = v - old_v;
              if (isnan(old_v) || (diff >= -0.0005f && diff <= 0.03f)) {
                id(g_hot_water_volume) = v;
              } else {
                ESP_LOGW("p1", "Discarded hot water volume jump: old=%.6f new=%.6f diff=%.6f",
                         old_v, v, diff);
              }
            }

            if (extract_numeric(telegram, "0-1:24.2.2(", v)) id(g_hot_water_flow_rate) = v;
            if (extract_numeric(telegram, "0-1:24.2.3(", v)) id(g_inlet_water_temperature) = v;
            if (extract_numeric(telegram, "0-1:24.2.4(", v)) id(g_outlet_water_temperature) = v;
            if (extract_numeric(telegram, "0-1:24.2.5(", v)) id(g_energy_content_volume) = v;
            if (extract_numeric(telegram, "0-1:24.2.6(", v)) id(g_energy_flow_rate) = v;

            // Meter ID
            if (extract_numeric(telegram, "0-0:96.1.0(", v)) id(g_meter_id) = v;

            ESP_LOGD(
              "p1",
              "parsed import=%.3f kWh power=%.3f kW volt_l1=%.1f V current_l1=%.1f A water=%.3f m3 flow=%.3f m3/h meter=%.0f",
              id(g_cumulative_active_import),
              id(g_momentary_active_import),
              id(g_voltage_l1),
              id(g_current_l1),
              id(g_hot_water_volume),
              id(g_hot_water_flow_rate),
              id(g_meter_id)
            );
          }

